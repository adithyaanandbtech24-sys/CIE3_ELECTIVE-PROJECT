<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shelf.nu — Open-Source Asset Management &amp; Scheduling</title>
    <link rel="icon" type="image/png" href="./assets/shelf-symbol.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- Left Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <a href="#home" class="brand-row" onclick="navigate('home'); return false;">
            <img src="./assets/shelf-symbol.png" alt="Shelf" class="brand-symbol" />
            <span class="brand-name">shelf</span>
            <span class="demo-pill">DEMO</span>
          </a>

          <div class="org-switcher" id="orgSwitcher">
            <div class="org-avatar">CE</div>
            <div class="org-meta">
              <div class="org-title">CIE3 Engineering Lab</div>
              <div class="org-plan">Team Workspace · 48 seats</div>
            </div>
            <svg class="icon-sm muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m7 15 5 5 5-5" /><path d="m7 9 5-5 5 5" />
            </svg>
          </div>
        </div>

        <button class="cmd-trigger" onclick="openCmdPalette()" title="Quick search (⌘K)">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />
          </svg>
          <span>Search assets, kits...</span>
          <kbd>⌘K</kbd>
        </button>

        <nav class="sidebar-nav">
          <div class="nav-label">Asset management</div>
          <button class="nav-item active" data-view="home" onclick="navigate('home')">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            </svg>
            <span>Home</span>
          </button>
          <button class="nav-item" data-view="assets" onclick="navigate('assets')">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22v-9" /><path d="M15.17 2.21a1.67 1.67 0 0 1 1.63 0L21 4.57a1.93 1.93 0 0 1 0 3.36L8.82 14.79a1.655 1.655 0 0 1-1.64 0L3 12.43a1.93 1.93 0 0 1 0-3.36z" /><path d="M20 13v3.87a2.06 2.06 0 0 1-1.11 1.83l-6 3.08a1.93 1.93 0 0 1-1.78 0l-6-3.08A2.06 2.06 0 0 1 4 16.87V13" />
            </svg>
            <span>Assets</span>
            <span class="nav-count" id="navAssetsCount">14</span>
          </button>
          <button class="nav-item" data-view="kits" onclick="navigate('kits')">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" /><path d="M12 22V12" /><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7" />
            </svg>
            <span>Kits</span>
            <span class="nav-count" id="navKitsCount">4</span>
          </button>
          <button class="nav-item" data-view="locations" onclick="navigate('locations')">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" /><circle cx="12" cy="10" r="3" />
            </svg>
            <span>Locations</span>
          </button>
          <button class="nav-item" data-view="bookings" onclick="navigate('bookings')">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect width="18" height="18" x="3" y="4" rx="2" /><path d="M16 2v4" /><path d="M8 2v4" /><path d="M3 10h18" />
            </svg>
            <span>Bookings &amp; Calendar</span>
            <span class="nav-count" id="navBookingsCount">5</span>
          </button>
          <button class="nav-item" data-view="reports" onclick="navigate('reports')">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v4a2 2 0 0 0 2 2h4" /><path d="M8 18v-1" /><path d="M12 18v-6" /><path d="M16 18v-3" />
            </svg>
            <span>Reports &amp; Audits</span>
          </button>

          <div class="nav-label mt-16">Tools</div>
          <button class="nav-item" data-view="scanner" onclick="navigate('scanner')">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 7V5a2 2 0 0 1 2-2h2" /><path d="M17 3h2a2 2 0 0 1 2 2v2" /><path d="M21 17v2a2 2 0 0 1-2 2h-2" /><path d="M7 21H5a2 2 0 0 1-2-2v-2" /><path d="M7 12h10" />
            </svg>
            <span>QR Scanner</span>
            <span class="live-dot" title="Interactive Simulator"></span>
          </button>
          <button class="nav-item" onclick="resetDemoData()">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" />
            </svg>
            <span>Reset Demo Data</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="user-card">
            <img src="./assets/default_pfp.jpg" alt="Adithya Anand" class="user-avatar" />
            <div class="user-meta">
              <div class="user-name">Adithya Anand</div>
              <div class="user-role">Owner · CIE3 Lab</div>
            </div>
            <span class="status-online" title="Local Sandbox Active"></span>
          </div>
        </div>
      </aside>

      <!-- Main Viewport -->
      <div class="main-wrap">
        <header class="topbar">
          <div class="topbar-left">
            <div class="breadcrumbs" id="breadcrumbs">
              <span>CIE3 Engineering Lab</span>
              <span class="crumb-sep">/</span>
              <strong id="crumbCurrent">Home</strong>
            </div>
          </div>
          <div class="topbar-actions">
            <button class="btn btn-secondary" onclick="exportAssetsCSV()">
              <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" x2="12" y1="15" y2="3" />
              </svg>
              Export CSV
            </button>
            <button class="btn btn-secondary" onclick="openNewBookingModal()">
              <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect width="18" height="18" x="3" y="4" rx="2" /><path d="M16 2v4" /><path d="M8 2v4" /><path d="M3 10h18" />
              </svg>
              New Booking
            </button>
            <button class="btn btn-primary" onclick="openNewAssetModal()">
              <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 12h14" /><path d="M12 5v14" />
              </svg>
              New Asset
            </button>
          </div>
        </header>

        <main class="page-content" id="pageContent"></main>
      </div>
    </div>

    <!-- Asset Detail Slide-Over Drawer -->
    <div class="drawer-backdrop" id="assetDrawerBackdrop" onclick="closeAssetDrawer()"></div>
    <aside class="drawer" id="assetDrawer" aria-hidden="true"></aside>

    <!-- Generic Modal Root -->
    <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()"></div>
    <div class="modal" id="modalRoot" role="dialog" aria-modal="true"></div>

    <!-- Command Palette -->
    <div class="modal-backdrop" id="cmdBackdrop" onclick="closeCmdPalette()"></div>
    <div class="cmd-modal" id="cmdModal">
      <div class="cmd-input-wrap">
        <svg class="icon-sm muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />
        </svg>
        <input
          type="text"
          id="cmdInput"
          placeholder="Type an asset name, QR tag (e.g. SHF-104), location, or command..."
          oninput="renderCmdResults(this.value)"
        />
        <kbd>ESC</kbd>
      </div>
      <div class="cmd-results" id="cmdResults"></div>
    </div>

    <!-- Toast Container -->
    <div class="toast-stack" id="toastStack"></div>

    <script src="./app.js"></script>
  </body>
</html>
